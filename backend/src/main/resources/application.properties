spring.application.name=SmartBankAI
server.port=8081

# MSSQL Ba?lant? Yap?land?rmas? (Environment Variable + Default Fallback)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SmartBankAI_DB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:SmartBank123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# AI Microservice URL
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000/predict}